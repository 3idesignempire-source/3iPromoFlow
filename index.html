<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category & Clients Management</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Category & Client Mapping System</h2>

        <div class="row">
            <!-- Category Form Section -->
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h4 id="form_title" class="mb-3">Add Category</h4>
                    <form id="categoryForm">
                        <!-- Hidden ID to track Edit mode -->
                        <input type="hidden" id="category_id" name="category_id">
                        
                        <div class="mb-3">
                            <label for="category_name" class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="category_name" required placeholder="e.g. Food and Beverage">
                        </div>
                        
                        <button type="submit" id="submit_btn" class="btn btn-primary w-100">Save Category</button>
                        <button type="button" id="cancel_btn" class="btn btn-secondary w-100 mt-2 d-none" onclick="resetForm()">Cancel</button>
                    </form>
                </div>
            </div>

            <!-- Category List Table Section -->
            <div class="col-md-8">
                <div class="card shadow-sm p-3">
                    <h4 class="mb-3">Category List</h4>
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Mapped Clients Count</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <!-- Dynamic Data will load here -->
                            <tr>
                                <td colspan="4" class="text-center">No categories found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Handling Edit & Data Binding -->
    <script>
        // டெமோவுக்காக லோக்கல் டேட்டாவை பயன்படுத்துகிறோம் (இதை உங்கள் டேட்டாபேஸ்/Backend API-க்கு மாற்றிக்கொள்ளலாம்)
        let categories = [
            { id: 1, name: "F&B", clientsCount: 5 },
            { id: 2, name: "IT Services", clientsCount: 3 }
        ];

        // டேபிளை லோட் செய்யும் பங்க்ஷன்
        function loadCategories() {
            let tbody = document.getElementById('categoryTableBody');
            tbody.innerHTML = "";

            if (categories.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center">No categories found</td></tr>`;
                return;
            }

            categories.forEach(cat => {
                tbody.innerHTML += `
                    <tr>
                        <td>${cat.id}</td>
                        <td id="name_${cat.id}">${cat.name}</td>
                        <td><span class="badge bg-info text-dark">${cat.clientsCount} Clients</span></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${cat.id}, '${cat.name}')">Edit</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Edit பட்டனை கிளிக் செய்யும் போது டேட்டா ஃபார்மிற்கு மேலே போவது
        function editCategory(id, name) {
            document.getElementById('category_id').value = id;
            document.getElementById('category_name').value = name;
            
            document.getElementById('form_title').innerText = "Edit Category";
            document.getElementById('submit_btn').innerText = "Update Category";
            document.getElementById('cancel_btn').classList.remove('d-none');
        }

        // ஃபார்மை ரீசெட் செய்ய
        function resetForm() {
            document.getElementById('categoryForm').reset();
            document.getElementById('category_id').value = "";
            document.getElementById('form_title').innerText = "Add Category";
            document.getElementById('submit_btn').innerText = "Save Category";
            document.getElementById('cancel_btn').classList.add('d-none');
        }

        // ஃபார்ம் சப்மிட் (Save அல்லது Update) செய்யும்போது நடப்பது
        document.getElementById('categoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let id = document.getElementById('category_id').value;
            let name = document.getElementById('category_name').value;

            if (id === "") {
                // புது என்ட்ரி (Insert)
                let newId = categories.length > 0 ? categories[categories.length - 1].id + 1 : 1;
                categories.push({ id: newId, name: name, clientsCount: 0 });
            } else {
                // எடிட் / அப்டேட் (Update) - ID மாறாது, நேம் மட்டும் மாறும்! கிளைன்ட் மேப்பிங் அப்படியே பாதுகாப்பாக இருக்கும்.
                let cat = categories.find(c => c.id == id);
                if (cat) {
                    cat.name = name; // ஸ்பெல்லிங் அல்லது பெயர் மாற்றப்பட்டாலும் ID மாறாது
                }
            }

            loadCategories();
            resetForm();
        });

        // ஆரம்பத்தில் டேபிளை லோட் செய்தல்
        loadCategories();
    </script>

</body>
</html>
